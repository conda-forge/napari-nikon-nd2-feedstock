{% set name = "napari-nikon-nd2" %}
{% set version = "0.2.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 5fa49ae46821d0ed0018d0cf8bd1c7d90d20dc4f42c11904336b2b3acbab21e9

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - nd2reader
    - pip
    - python >=3.6
    - setuptools-scm
  run:
    - napari-plugin-engine >=0.1.4
    - nd2reader
    - numpy
    - python >=3.6,<=3.9

test:
  imports:
    - napari_nikon_nd2
  commands:
    - pip list
    - pip check
  requires:
    - pip

about:
  home: https://github.com/cwood1967/napari-nikon-nd2
  summary: Opens Nikon ND2 files into napari.
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - jaimergp
    - cwood1967
